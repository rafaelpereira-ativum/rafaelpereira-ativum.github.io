<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="stylesheet" href="tema.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Ativum</title>

    <link rel="icon" type="image/png" id="favicon-tag" href="imagens/faviconB.png">
    <script src="main.js" defer></script>
    <style>
        .secao-contato {
            max-width: 1000px;
            margin: 0 auto;
            background: transparent !important;
            text-align: center;
        }

        .titulo-principal {
            font-size: 52px;
            color: var(--cor-texto);
            margin-bottom: 25px;
            background: transparent !important;
        }

        .texto-informativo {
            font-size: 22px;
            color: var(--cor-texto);
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto 60px auto;
            background: transparent !important;
        }

        .flex-contato {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 40px;
            background: transparent !important;
            text-align: left;
            max-width: 900px;
            margin: 0 auto;
        }

        .coluna-dados {
            flex: 1;
            background: transparent !important;
        }

        .coluna-embed {
            background: transparent !important;
        }

        .subtitulo-contato {
            font-family: 'Bree Serif', Georgia, serif !important;
            font-size: 36px;
            color: var(--cor-texto);
            text-decoration: underline;
            margin-bottom: 15px;
            background: transparent !important;
        }

        .numero-telefone {
            font-size: 32px;
            color: #FFD700;
            font-weight: 700;
            background: transparent !important;
        }

        .whatsapp-frame {
            width: 400px;
            height: 400px;
            border: 3px solid var(--cor-borda);
            border-radius: 4px;
            display: block;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html, a, p, span {
            font-family: 'Roboto Condensed', sans-serif !important;
            background-color: var(--cor-fundo);
            color: var(--cor-texto);
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Bree Serif', Georgia, serif !important;
            font-weight: normal;
            color: var(--cor-texto);
        }

        @font-face {
            font-family: 'Bree Serif';
            src: url('imagens/BreeSerif-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Roboto Condensed';
            src: url('imagens/RobotoCondensed-VariableFont_wght.ttf') format('truetype');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }

        .area-conteudo-central {
            margin-top: 140px;
            padding: 60px 20px;
            min-height: calc(100vh - 253px);
            background-color: var(--cor-fundo);
        }

        .footer-container {
            width: 100%;
            background-color: var(--cor-fundo-footer);
            padding: 30px 20px;
            text-align: center;
        }

        .footer-main-text {
            color: var(--cor-texto-footer);
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 8px;
            background: transparent !important;
        }

        .footer-sub-text {
            color: var(--cor-sub-footer);
            font-size: 13px;
            background: transparent !important;
        }

        @media (max-width: 768px) {
            .flex-contato {
                flex-direction: column;
                align-items: center;
                text-align: center;
                gap: 30px;
            }
            .whatsapp-frame {
                width: 400px;
                height: 400px;
            }
            .area-conteudo-central {
                margin-top: 220px;
            }
        }
    </style>
</head>
<body>

    <div id="global-header-destination"></div>
    
    <div class="area-conteudo-central">
        <div class="secao-contato">
            <h1 class="titulo-principal">Contato</h1>
            <p class="texto-informativo">Além do nosso site, você pode perguntar sobre demais coisas sobre os nossos produtos e preços através do nosso WhatsApp.</p>
            
            <div class="flex-contato">
                <div class="coluna-dados">
                    <h2 class="subtitulo-contato">Fale Conosco:</h2>
                    <p class="numero-telefone">(51) 98024-7857</p>
                </div>
                
                <div class="coluna-embed">
                    <iframe src="extra/whatsapp-remade.html" width="100%" height="500px" style="border:none;"></iframe>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer-container">
        <p class="footer-main-text">© Copyright 2026 - Rafael da Silva Pereira</p>
        <p class="footer-sub-text">Feito com o auxílio de GitHub Pages, pertencente a Microsoft</p>
    </footer>

    <script>
        fetch('cabecalho.html')
            .then(response => response.text())
            .then(htmlText => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                const template = doc.getElementById('template-cabecalho');
                const clone = document.importNode(template.content, true);
                
                const headerInstance = clone.getElementById('ativum-header-element');
                
                window.addEventListener('scroll', function() {
                    if (window.scrollY > 50) {
                        headerInstance.classList.add('encolhido');
                    } else {
                        headerInstance.classList.remove('encolhido');
                    }
                });

                document.getElementById('global-header-destination').appendChild(clone);
            });
    </script>

</body>
</html>
