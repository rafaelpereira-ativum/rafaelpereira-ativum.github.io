<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ativum Holding</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; background-color: #f8f9fa; margin: 0; padding: 20px; color: #333; }
        .container { background: white; max-width: 500px; margin: 60px auto; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h1 { color: #1a202c; font-size: 28px; margin-bottom: 10px; }
        p { color: #4a5568; font-size: 16px; line-height: 1.6; }
        .preco { font-size: 32px; color: #2ecc71; font-weight: bold; margin: 25px 0; }
        .btn-vendas { display: inline-block; background-color: #25d366; color: white; padding: 16px 32px; text-decoration: none; font-size: 18px; font-weight: bold; border-radius: 8px; box-shadow: 0 4px 12px rgba(37,211,102,0.3); transition: 0.3s; }
        .btn-vendas:hover { background-color: #20ba5a; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="container">
        <h1>Ativum Holding</h1>
        <p>Seja bem-vindo! Nossa plataforma de soluções comerciais e vendas diretas está sendo estruturada.</p>
        <div class="preco">Consulte Nossos Planos</div>
        <!-- Substitua o link abaixo com o link do seu WhatsApp ou meio de pagamento -->
        <a href="https://wa.me" target="_blank" class="btn-vendas">Falar com Consultor</a>
    </div>

</body>
</html>
