<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ativum Holding</title>

    <!-- Tags Base dos Favicons -->
    <link rel="icon" type="image/png" id="favicon-tag" href="imagens/faviconB.png">

    <style>
        /* Importação Direta e Segura das Fontes no CSS (Evita bloqueios do navegador) */
        @import url('https://googleapis.com');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Força a fonte Open Sans em absolutamente TODOS os textos e links do site */
        body, html, a, p, span, li, nav {
            font-family: 'Open Sans', system-ui, -apple-system, sans-serif !important;
            background-color: #ffffff;
        }

        /* Força a fonte Bree Serif em todos os Títulos sem exceção */
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Bree Serif', serif !important;
        }

        /* Cabeçalho Branco Horizontal Infinito */
        .header-container {
            width: 100%;
            background-color: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            position: relative;
        }

        /* Alinhamento dos Elementos no Centro */
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        /* Grupos de Links Laterais */
        .nav-group {
            display: flex;
            gap: 40px;
            flex: 1;
        }
        .nav-group.left {
            justify-content: flex-start;
        }
        .nav-group.right {
            justify-content: flex-end;
        }

        /* Estilização dos Links */
        .nav-link {
            color: #000000;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: color 0.2s ease-in-out;
        }

        /* Efeito Hover e Active */
        .nav-link:hover, .nav-link:active {
            color: #FFD700;
        }

        /* Container da Logo Centralizada */
        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 30px;
        }

        /* Configuração da blindagem da logo */
        .logo-blindada {
            height: 100px;
            width: 150px;
            background-image: url('imagens/main-logo.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            position: relative;
        }

        /* Camada invisível protetora por cima */
        .logo-img-top {
            width: 100%;
            height: 100%;
            display: block;
            cursor: default;
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                height: auto;
                padding: 20px 10px;
                gap: 15px;
            }
            .nav-group {
                gap: 20px;
                justify-content: center !important;
            }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <header class="header-content">
            <!-- Lado Esquerdo -->
            <nav class="nav-group left">
                <a href="https://ativumholding.com.br" class="nav-link">Início</a>
                <a href="https://ativumholding.com.br" class="nav-link">Página de Vendas</a>
            </nav>

            <!-- Centro (Logo Blindada) -->
            <div class="logo-container">
                <div class="logo-blindada">
                    <img src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='1' height='1'></svg>" class="logo-img-top" oncontextmenu="return false;">
                </div>
            </div>

            <!-- Lado Direito -->
            <nav class="nav-group right">
                <a href="https://ativumholding.com.br" class="nav-link">Sobre</a>
                <a href="https://ativumholding.com.br" class="nav-link">Contato</a>
            </nav>
        </header>
    </div>

    <!-- Bloco de Teste Real das Fontes Corrigidas -->
    <div style="text-align: center; margin-top: 60px; padding: 20px;">
        <h1 style="font-size: 38px; margin-bottom: 15px; color: #0f172a;">Isto é um Título em Bree Serif</h1>
        <p style="font-size: 18px; color: #64748b;">Isto é um parágrafo normal em Open Sans.</p>
    </div>

    <!-- Script Inteligente do Favicon -->
    <script>
        const faviconTag = document.getElementById('favicon-tag');
        const matcher = window.matchMedia('(prefers-color-scheme: dark)');
        
        function updateFavicon() {
            if (matcher.matches) {
                faviconTag.href = 'imagens/faviconW.png?v=' + Date.now();
            } else {
                faviconTag.href = 'imagens/faviconB.png?v=' + Date.now();
            }
        }
        
        updateFavicon();
        matcher.addEventListener('change', updateFavicon);
    </script>

</body>
</html>
