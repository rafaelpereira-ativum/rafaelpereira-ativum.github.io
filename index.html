<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ativum Holding | Seu amigo para a escolha de seu imóvel</title>

    <link rel="icon" type="image/png" id="favicon-tag" href="imagens/faviconB.png">

    <style>
        .hero-section {
            position: relative;
            width: 100%;
            min-height: 450px;
            background-image: url('https://edificempreendimentos.com.br/blog/wp-content/uploads/2019/11/dicas-para-escolher-o-terreno-perfeito-990x550.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
                max-width: 800px;
            text-align: center;
            padding: 40px 20px;
            color: #ffffff;
        }
    
        .hero-content h1 {
            font-size: 42px;
            margin-bottom: 20px;
            line-height: 1.2;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .hero-content p {
            font-size: 20px;
            line-height: 1.6;
            max-width: 650px;
            margin: 0 auto;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        @font-face {
            font-family: 'Bree Serif';
            src: url('imagens/BreeSerif-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Roboto Condensed';
            src: url('imagens/RobotoCondensed-VariableFont_wght.ttf') format('truetype');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html, a, p, span, nav {
            font-family: 'Roboto Condensed', sans-serif !important;
            background-color: #ffffff;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Bree Serif', Georgia, serif !important;
            font-weight: normal;
        }

        .header-container {
            width: 100%;
            background-color: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            position: relative;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .nav-group {
            display: flex;
            gap: 40px;
            flex: 1;
        }
        .nav-group.left {
            justify-content: flex-start;
        }
        .nav-group.right {
            justify-content: flex-end;
        }

        .nav-link {
            color: #000000;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: color 0.2s ease-in-out;
        }

        .nav-link:hover, .nav-link:active {
            color: #FFD700;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 30px;
        }

        .logo-blindada {
            height: 100px;
            width: 150px;
            background-image: url('imagens/main-logo.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            position: relative;
        }

        .logo-img-top {
            width: 100%;
            height: 100%;
            display: block;
            cursor: default;
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                height: auto;
                padding: 20px 10px;
                gap: 15px;
            }
            .nav-group {
                gap: 20px;
                justify-content: center !important;
            }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <header class="header-content">
            <nav class="nav-group left">
                <a href="https://ativumholding.com.br/" class="nav-link">Início</a>
                <a href="https://ativumholding.com.br/vendas" class="nav-link">Página de Vendas</a>
            </nav>

            <div class="logo-container">
                <div class="logo-blindada">
                    <img src="imagens/vazio.png" class="logo-img-top" oncontextmenu="return false;">
                </div>
            </div>

            <nav class="nav-group right">
                <a href="https://ativumholding.com.br/sobre" class="nav-link">Sobre</a>
                <a href="https://ativumholding.com.br/contato" class="nav-link">Contato</a>
            </nav>
        </header>
    </div>

    <section class="hero-section">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1>A empresa para te ajudar na hora de escolher</h1>
            <p>As opções estão postas, para te ajudar na hora da decisão de compra. São vários imóveis, todos a sua disposição.</p>
        </div>
    </section>

    <script>
        const faviconTag = document.getElementById('favicon-tag');
        const matcher = window.matchMedia('(prefers-color-scheme: dark)');
        
        function updateFavicon() {
            if (matcher.matches) {
                faviconTag.href = 'imagens/faviconW.png?v=' + Date.now();
            } else {
                faviconTag.href = 'imagens/faviconB.png?v=' + Date.now();
            }
        }
        
        updateFavicon();
        matcher.addEventListener('change', updateFavicon);
    </script>

</body>
</html>
