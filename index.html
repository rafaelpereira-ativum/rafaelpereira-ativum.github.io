<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" type="image/png" href="imagens/faviconW.png" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/png" href="imagens/faviconB.png" media="(prefers-color-scheme: light)">

    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Bree+Serif&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ativum Holding</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Open Sans', system-ui, -apple-system, sans-serif; /* Fonte para textos normais */
            background-color: #ffffff;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Bree Serif', serif; /* Fonte para títulos */
        }

        /* Cabeçalho Branco Horizontal Infinito */
        .header-container {
            width: 100%;
            background-color: #ffffff;
            border-bottom: 1px solid #e2e8f0; /* Borda cinza extra-fina */
            position: relative;
        }

        /* Alinhamento dos Elementos no Centro */
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        /* Grupos de Links Laterais */
        .nav-group {
            display: flex;
            gap: 40px;
            flex: 1;
        }
        .nav-group.left {
            justify-content: flex-start;
        }
        .nav-group.right {
            justify-content: flex-end;
        }

        /* Estilização dos Links */
        .nav-link {
            color: #000000; /* Cor principal preta */
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: color 0.2s ease-in-out;
        }

        /* Efeito Hover e Active */
        .nav-link:hover, .nav-link:active {
            color: #FFD700; /* Cor dourada */
        }

        /* Container da Logo Centralizada */
        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 30px;
        }
        
        /* Configuração da blindagem da logo */
        .logo-blindada {
            height: 100px; /* Altura da sua logo */
            width: 150px;  /* Largura aproximada (ajuste se a logo ficar esticada ou espremida) */
            background-image: url('imagens/main-logo.png'); /* Sua logo real fica protegida no fundo */
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            position: relative;
        }

        /* Camada invisível protetora por cima */
        .logo-img-top {
            width: 100%;
            height: 100%;
            display: block;
            cursor: default;
        }

        /* Ajuste Responsivo para Celulares */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                height: auto;
                padding: 20px 10px;
                gap: 15px;
            }
            .nav-group {
                gap: 20px;
                justify-content: center !important;
            }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <header class="header-content">
            <!-- Lado Esquerdo -->
            <nav class="nav-group left">
                <a href="https://ativumholding.com.br" class="nav-link">Início</a>
                <a href="https://ativumholding.com.br" class="nav-link">Página de Vendas</a>
            </nav>

            <!-- Centro (Logo Blindada) -->
            <div class="logo-container">
                <div class="logo-blindada">
                    <!-- Quadrado transparente protetor que bloqueia o clique e download -->
                    <img src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='1' height='1'></svg>" alt="" class="logo-img-top" oncontextmenu="return false;">
                </div>
            </div>


            <!-- Lado Direito -->
            <nav class="nav-group right">
                <a href="https://ativumholding.com.br" class="nav-link">Sobre</a>
                <a href="https://ativumholding.com.br" class="nav-link">Contato</a>
            </nav>
        </header>
    </div>

</body>
</html>
