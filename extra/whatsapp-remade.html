<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp</title>
    <link rel="stylesheet" href="tema.css">
    <style>
        body {
            font-family: 'Helvetica-Neue', sans-serif !important;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200vh;
            background-color: #ffffff;
            color: #FFFFFF;
        }

        .whatsapp-container {
            text-align: center;
            padding: 10px;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }

        .wp-logo {
            width: 130px;
            height: auto;
            margin-bottom: 25px;
        }

        .wp-title {
            font-size: 1.15rem;
            font-weight: normal;
            color: #1c1e21;
            margin-bottom: 35px;
            line-height: 1.4;
            padding: 0 15px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            width: 100%;
        }

        .wp-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 90%;
            max-width: 290px;
            padding: 11px 20px;
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            border-radius: 50px;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
            box-sizing: border-box;
            cursor: pointer;
        }

        .btn-app {
            background-color: #25d366;
            color: #000000;
            border: 1px solid #000000;
        }

        .btn-web {
            background-color: transparent;
            color: #000000;
            border: 1px solid #000000;
        }

        @font-face {
            font-family: 'Helvetica-Neue';
            src: url('extra/HelveticaNeue-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @media (hover: hover) {
            .wp-btn:hover {
                background-color: #000000 !important;
                color: #ffffff !important;
                border-color: #000000 !important;
            }
        }

        @media (pointer: coarse) {
            .btn-web {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <div class="whatsapp-container">
        <img src="imagens/whatsapp-logo.png" alt="WhatsApp" class="wp-logo">
        
        <h1 class="wp-title">Conversar com Rafael (+55 51 98024-7857) <br>no WhatsApp</h1>
        
        <div class="btn-group">
            <a href="https://whatsapp.com" class="wp-btn btn-app" target="_blank" rel="noopener noreferrer">Abrir app</a>
            <a href="https://whatsapp.com" class="wp-btn btn-web" target="_blank" rel="noopener noreferrer">Continuar no WhatsApp Web</a>
        </div>
    </div>

</body>
</html>
