<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Nome da página alterado -->
    <title>Erro 404 | Não encontrado</title>

    <!-- Tags Base dos Favicons -->
    <link rel="icon" type="image/png" id="favicon-tag" href="imagens/faviconB.png">

    <style>
        /* Cadastro da sua fonte local para os Títulos (Bree Serif / Bree Sans) */
        @font-face {
            font-family: 'Bree Serif';
            src: url('imagens/BreeSerif-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        /* Cadastro da sua fonte local para Textos e Links (Roboto Condensed) */
        @font-face {
            font-family: 'Roboto Condensed';
            src: url('imagens/RobotoCondensed-VariableFont_wght.ttf') format('truetype');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            background-color: #ffffff;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Container Centralizado na Tela (Sem cabeçalho) */
        .error-wrapper {
            text-align: center;
            padding: 20px;
            max-width: 600px;
            width: 100%;
        }

        /* Título 404 */
        h1 {
            font-family: 'Bree Serif', Georgia, serif !important;
            font-size: 120px;
            color: #000000;
            line-height: 1;
            margin-bottom: 20px;
            font-weight: normal;
        }

        /* Texto descritivo e Links */
        p, a {
            font-family: 'Roboto Condensed', sans-serif !important;
            font-size: 20px;
            color: #000000;
            line-height: 1.5;
        }

        /* Estilização em Itálico para a palavra "nada" */
        em {
            font-style: italic;
        }

        /* Link para voltar */
        a {
            color: #000000;
            text-decoration: underline;
            font-weight: 600;
            transition: color 0.2s ease-in-out;
        }

        /* Efeito dourado ao passar o mouse ou clicar no link */
        a:hover, a:active {
            color: #FFD700;
        }

        @media (max-width: 768px) {
            h1 { font-size: 90px; }
            p { font-size: 18px; }
        }
    </style>
</head>
<body>

    <div class="error-wrapper">
        <!-- Título principal -->
        <h1>404</h1>
        
        <!-- Texto com formatação em itálico e link incorporado -->
        <p>A página em que você está não existe. Basicamente um <em>nada</em>! Volte para a página inicial <a href="https://ativumholding.com.br">aqui</a>.</p>
    </div>

    <!-- Script do Favicon Inteligente -->
    <script>
        const faviconTag = document.getElementById('favicon-tag');
        const matcher = window.matchMedia('(prefers-color-scheme: dark)');
        
        function updateFavicon() {
            if (matcher.matches) {
                faviconTag.href = 'imagens/faviconW.png?v=' + Date.now();
            } else {
                faviconTag.href = 'imagens/faviconB.png?v=' + Date.now();
            }
        }
        
        updateFavicon();
        matcher.addEventListener('change', updateFavicon);
    </script>

</body>
</html>
